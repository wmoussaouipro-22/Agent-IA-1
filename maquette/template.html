<title>Eco-Locaux CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block">
<style>
/* Layout : barre latérale fixe vert bouteille (260px) + espace de travail fluide ; sous 900px, la barre devient un bandeau supérieur. */
:root {
  --side: #0b4d34; --side-ink: #e6f4eb; --side-muted: #96d4b2; --side-active: #13603f;
  --bg: #f5f8f6; --surface: #ffffff; --surface-2: #e9f3ee; --line: #e1e8e4; --line-soft: #f1f4f2;
  --ink: #14231c; --ink-2: #5e6b64; --ink-3: #8c9991;
  --primary: #0b4d34; --primary-hover: #083b27; --on-primary: #ffffff; --link: #0b4d34;
  --sage: #e3efe8; --sage-ink: #0b4d34;
  --amber: #b7791f; --amber-bg: #fef7ed; --amber-line: #f6d09a;
  --red: #b23b3b; --red-bg: #fdf2f2; --red-line: #f4b4b4;
  --grey-bg: #f1f4f2; --grey-ink: #5e6b64;
  --bar: #2e694e; --bar-soft: #96d4b2; --grid: #e7eeea;
  --shadow-menu: 0 4px 12px rgba(20, 35, 28, 0.10); --shadow-modal: 0 12px 32px rgba(20, 35, 28, 0.18); --veil: rgba(20, 35, 28, 0.40);
  --hot: #c2410c; --hot-bg: #fff1e8; --cold: #1d6fb8; --cold-bg: #eaf3fb; --exam: #b7791f; --gone: #8c9991;
  --map-land: #e6efe9; --map-park: #d3e6d9; --map-water: #a9d4ee; --map-road: #ffffff; --map-ring: #0b4d34;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --side: #0a2a1d; --side-ink: #e3eee8; --side-muted: #7fb99a; --side-active: #154a33;
    --bg: #0f1814; --surface: #16211c; --surface-2: #1b2a23; --line: #2a3a32; --line-soft: #202e27;
    --ink: #e3eee8; --ink-2: #a3b3ab; --ink-3: #7d8d85;
    --primary: #2f8a60; --primary-hover: #37a070; --on-primary: #ffffff; --link: #8fd3b0;
    --sage: #1d3a2d; --sage-ink: #a6e0c2;
    --amber: #f0c27a; --amber-bg: #33270f; --amber-line: #6b5120;
    --red: #f4a5a5; --red-bg: #3a1d1d; --red-line: #6e3434;
    --grey-bg: #222f29; --grey-ink: #a9b6af;
    --bar: #6cc398; --bar-soft: #2f6e51; --grid: #24332c;
    --shadow-menu: 0 4px 14px rgba(0, 0, 0, 0.45); --shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.55); --veil: rgba(0, 0, 0, 0.55);
    --hot: #fb8a4c; --hot-bg: #3a2216; --cold: #6fb3ec; --cold-bg: #16283a; --exam: #f0c27a; --gone: #7d8d85;
    --map-land: #17241e; --map-park: #1d3328; --map-water: #1f4258; --map-road: #2c3d35; --map-ring: #8fd3b0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --side: #0a2a1d; --side-ink: #e3eee8; --side-muted: #7fb99a; --side-active: #154a33;
  --bg: #0f1814; --surface: #16211c; --surface-2: #1b2a23; --line: #2a3a32; --line-soft: #202e27;
  --ink: #e3eee8; --ink-2: #a3b3ab; --ink-3: #7d8d85;
  --primary: #2f8a60; --primary-hover: #37a070; --on-primary: #ffffff; --link: #8fd3b0;
  --sage: #1d3a2d; --sage-ink: #a6e0c2;
  --amber: #f0c27a; --amber-bg: #33270f; --amber-line: #6b5120;
  --red: #f4a5a5; --red-bg: #3a1d1d; --red-line: #6e3434;
  --grey-bg: #222f29; --grey-ink: #a9b6af;
  --bar: #6cc398; --bar-soft: #2f6e51; --grid: #24332c;
  --shadow-menu: 0 4px 14px rgba(0, 0, 0, 0.45); --shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.55); --veil: rgba(0, 0, 0, 0.55);
  --hot: #fb8a4c; --hot-bg: #3a2216; --cold: #6fb3ec; --cold-bg: #16283a; --exam: #f0c27a; --gone: #7d8d85;
  --map-land: #17241e; --map-park: #1d3328; --map-water: #1f4258; --map-road: #2c3d35; --map-ring: #8fd3b0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); }
.num, td.num, .tab { font-variant-numeric: tabular-nums lining-nums; }
.ms { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 20; vertical-align: middle; width: 1em; overflow: hidden; flex: none; color: transparent; }
.icons-ok .ms { color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Coque ---------- */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 24px; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 12px; padding-inline: 8px; }
.brand .ms { font-size: 28px; }
.icons-ok .brand .ms { color: var(--side-muted); }
.brand b { display: block; font-size: 20px; letter-spacing: -0.01em; }
.brand small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-muted); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--side-ink); text-decoration: none; font-weight: 500; border: 1px solid transparent; }
.nav a:hover { background: rgba(255, 255, 255, 0.06); }
.nav a[aria-current="page"] { background: var(--side-active); border-color: rgba(255, 255, 255, 0.10); font-weight: 700; }
.nav a .count { margin-left: auto; font-size: 12px; font-weight: 600; background: rgba(0, 0, 0, 0.25); padding: 2px 8px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-inline: 8px; font-size: 13px; }
.me { display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 8px; background: var(--side-active); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.me small { display: block; color: var(--side-muted); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--side-muted); text-decoration: underline; cursor: pointer; text-align: left; font-size: 12px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.topbar .date { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 500; }
.topbar .spacer { flex: 1; }
.content { padding-block: 24px 48px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; max-width: 1480px; width: 100%; }

/* ---------- Composants ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.secondary { background: var(--surface); border-color: var(--primary); color: var(--link); }
.btn.secondary:hover { background: var(--sage); }
.btn.danger { background: var(--surface); border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: var(--red-bg); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.icon { width: 40px; padding: 0; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.iconbtn:hover, .iconbtn[aria-expanded="true"] { background: var(--sage); color: var(--sage-ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 20px 0; flex-wrap: wrap; }
.card-head h2, .card-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.card-head .hint { color: var(--ink-3); font-size: 12px; }
.card-body { padding: 16px 20px 20px; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.page-head p { margin: 6px 0 0; color: var(--ink-2); }
.dsrc { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--sage); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.dsrc .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.dsrc[data-state="live"] { color: var(--sage-ink); } .dsrc[data-state="live"] .dot { background: var(--sage-ink); }
.dsrc[data-state="wait"] .dot { animation: srcp 1s ease-in-out infinite alternate; }
.dsrc[data-state="err"] .dot { background: #c2410c; }
@keyframes srcp { to { opacity: .25; } }
@media (max-width: 520px) { #src-l { max-width: 150px; overflow: hidden; text-overflow: ellipsis; } }
.src-err { margin: 0; padding-block: 8px; padding-inline: 24px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink-2); background: var(--sage); word-break: break-word; user-select: text; }
.pill-inc { display: inline-flex; align-items: center; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; color: var(--ink-3); background: var(--sage); vertical-align: middle; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; color: var(--ink-2); background: var(--sage); padding: 3px 10px; border-radius: 6px; letter-spacing: 0; }

.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.b-sage { background: var(--sage); color: var(--sage-ink); }
.b-solid { background: var(--primary); color: var(--on-primary); }
.b-amber { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-line); }
.b-red { background: var(--red-bg); color: var(--red); border-color: var(--red-line); }
.b-grey { background: var(--grey-bg); color: var(--grey-ink); }
.b-out { background: transparent; color: var(--ink-2); border: 1px dashed var(--ink-3); }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.input, select.input, textarea.input { height: 40px; width: 100%; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
textarea.input { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; }
.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 25%, transparent); }
.input::placeholder { color: var(--ink-3); }
.input.soft { background: var(--surface-2); border-color: transparent; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); margin: 0; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 12px; background: var(--surface-2); border-radius: 8px; color: var(--ink-2); }
.switch input { appearance: none; width: 36px; height: 20px; border-radius: 10px; background: var(--ink-3); position: relative; margin: 0; cursor: pointer; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch input:checked { background: var(--primary); }
.switch input:checked::after { left: 18px; }

/* ---------- Tableaux ---------- */
.table-wrap { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; }
table.grid th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--bg); height: 40px; padding: 0 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid td { height: 52px; padding: 6px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid tbody tr:hover td { background: color-mix(in srgb, var(--sage) 45%, transparent); }
table.grid tbody tr.sel td { background: var(--sage); }
table.grid tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
table.grid .r { text-align: right; }
.code { color: var(--ink-2); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.ens { font-weight: 600; font-size: 15px; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.ens:hover { text-decoration: underline; }
.icons-ok .warn, .warn { font-size: 18px; margin-left: 4px; }
.icons-ok .warn { color: var(--amber); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.ital { font-style: italic; color: var(--ink-3); }

.menu { position: absolute; right: 0; top: 36px; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-menu); min-width: 180px; padding: 6px; display: flex; flex-direction: column; }
.menu button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; border: 0; background: none; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--sage); }
.menu button.del { color: var(--red); }
.menu button.del:hover { background: var(--red-bg); }
.rel { position: relative; display: inline-block; }

.filters { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.filters .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.filters .row2 { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.search { position: relative; }
.search .ms { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.icons-ok .search .ms { color: var(--ink-2); }
.search .input { padding-left: 44px; height: 48px; }
.potsel { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
.potsel select { width: auto; }
.push { margin-left: auto; }

.bulk { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--sage); color: var(--sage-ink); border-bottom: 1px solid var(--line); flex-wrap: wrap; font-weight: 600; }
.bulk select { width: auto; }
.pager { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager .info { color: var(--ink-2); margin-right: auto; }
.pager .info b { color: var(--ink); }
.pg { min-width: 40px; height: 40px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; }
.pg:hover { background: var(--sage); }
.pg[aria-current="page"] { background: var(--primary); color: var(--on-primary); }
.pg:disabled { color: var(--ink-3); cursor: default; background: none; }
.empty { padding: 40px 16px; text-align: center; color: var(--ink-2); }

/* ---------- Tableau de bord ---------- */
.scope { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px; gap: 3px; }
.scope button { border: 0; background: none; padding: 7px 14px; border-radius: 6px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.scope button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.kpi.ca { border-color: color-mix(in srgb, var(--primary) 35%, var(--line)); }
.inline-num { display: inline-flex; align-items: center; gap: 4px; }
.inline-num .input { width: 88px; height: 28px; padding: 0 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
.range { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.range .field { width: 160px; }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.kpi .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.kpi .val { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .val small { font-size: 15px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.kpi .sub { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi.alert { border-color: var(--amber-line); }
.kpi.alert .val { color: var(--amber); }
.dash { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: 158px minmax(0, 1fr) 44px; align-items: center; gap: 12px; }
.hbar .l { font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .track { height: 14px; position: relative; }
.hbar .fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; cursor: default; }
.hbar .fill.soft { background: var(--bar-soft); }
.hbar .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.hbar.sep { margin-top: 6px; padding-top: 12px; border-top: 1px dashed var(--line); }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--ink-2); font-family: var(--font); font-size: 11px; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .bl { stroke: var(--ink-3); stroke-width: 1; }
.chart .b { fill: var(--bar); }
.chart .b.cur { fill: var(--bar-soft); }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .b, .chart g:hover .b { opacity: .85; }
.zt td { height: 44px; }
.meter { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--grid); vertical-align: middle; margin-right: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--bar); }
.todo { display: flex; flex-direction: column; }
.todo li { list-style: none; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.todo li:first-child { border-top: 0; }
.todo ul { margin: 0; padding: 0; }
.when { font-size: 12px; font-weight: 600; text-align: center; border-radius: 6px; padding: 4px 0; background: var(--grey-bg); color: var(--grey-ink); font-variant-numeric: tabular-nums; }
.when.late { background: var(--red-bg); color: var(--red); }
.tour-card { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.tour-card > b { display: inline-flex; align-items: center; gap: 6px; }
.tour-in { margin: 8px 0 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.todo-sub { display: flex; align-items: center; gap: 6px; margin: 16px 0 4px; font-size: 13px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; } .todo-sub:first-child { margin-top: 8px; } .todo-sub .hint { text-transform: none; letter-spacing: 0; font-weight: 500; }
.kind-c { color: var(--amber); font-weight: 600; } .kind-p { color: var(--sage-ink); font-weight: 600; }
.tour-new { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 12px; } .tour-new > b { width: 100%; }
.tour-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.tour-chip { display: flex; flex-direction: column; align-items: flex-start; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font: inherit; color: inherit; cursor: pointer; }

.stops { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.stop { display: flex; gap: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); border-left: 4px solid var(--sage-ink); }

.stop-b { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; } .stop-b small { color: var(--ink-2); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; } .stop-b small .ms { font-size: 16px; }
.stop-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stop-a { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; } .stop-a .grow { flex: 1; }
.warn-txt { color: var(--red) !important; font-weight: 600; }
.mail-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.dash-src { margin-top: 8px; }
.banner.prop { border-color: var(--line); background: var(--cold-bg); color: var(--cold); } .banner.prop > span:not(.ms) { flex: 1; min-width: 200px; } .banner.prop .btn { flex: none; }
.energie { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; } .energie li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line-soft); } .energie li:first-child { border-top: 0; }
.energie li > div { flex: 1; min-width: 200px; display: flex; flex-direction: column; } .energie small { color: var(--ink-2); }
.banner.rdv-b { border-color: var(--line); background: var(--sage); color: var(--sage-ink); flex-wrap: wrap; } .banner.rdv-b > span:not(.ms) { flex: 1; min-width: 220px; } .rdv-b select { width: auto; }
.st-edit { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 8px; background: var(--surface-2); }
.hist { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; } .hist li { display: flex; flex-direction: column; font-size: 13px; } .hist small { color: var(--ink-2); }
.prediag { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); } .prediag > b { display: inline-flex; align-items: center; gap: 6px; }
.dm { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; } .dm li { display: inline-flex; align-items: center; gap: 4px; } .dm li.ok { color: var(--sage-ink); } .dm li.ko { color: var(--ink-3); } .dm .ms { font-size: 16px; }
.tour-pick { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.tour-add { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.b-rdv { background: var(--cold-bg); color: var(--cold); border-color: transparent; font-weight: 700; }
.b-first { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-line); }
.stop.mot-rdv { border-left-color: var(--cold); background: var(--cold-bg); } .stop.mot-rdv .stop-n { background: var(--cold); color: var(--surface); }
.tour-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tour-edit { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.tour-del { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--red-line); background: var(--red-bg); color: var(--red); }
.rdv-day { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--cold-bg); }
.rdv-day > b { color: var(--cold); display: inline-flex; align-items: center; gap: 6px; }
.pick-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; }
.pick-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; } .pick-row:first-child { border-top: 0; }
.pick-row > div { flex: 1; min-width: 180px; display: flex; flex-direction: column; } .pick-row small { color: var(--ink-2); }
.pick-nav { display: flex; align-items: center; gap: 8px; justify-content: flex-end; color: var(--ink-2); }
.mail-list { list-style: none; margin: 0; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.mail-open { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.mail-open:hover { background: var(--surface-2); }
.mail-ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; background: var(--sage); color: var(--sage-ink); flex: none; }
.mail-t { display: flex; flex-direction: column; min-width: 0; flex: 1; } .mail-t b, .mail-t small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .mail-t small { color: var(--ink-3); }
.ag-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); overflow: hidden; }
.ag-day { background: var(--surface); min-height: 180px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ag-day.is-today { background: var(--surface-2); }
.ag-h { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); text-transform: capitalize; } .ag-day.is-today .ag-h b { color: var(--sage-ink); }
.ag-ev { display: flex; flex-direction: column; gap: 2px; text-align: left; border: 0; border-left: 3px solid var(--primary); background: var(--sage); border-radius: 6px; padding: 6px 8px; font: inherit; color: inherit; cursor: pointer; min-width: 0; }
.ag-ev small { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ag-time { font-size: 12px; font-weight: 700; color: var(--sage-ink); }

@media (max-width: 760px) { .ag-grid { grid-template-columns: 1fr; } .ag-day { min-height: 0; } }
.next-step { margin: 4px 20px 0; width: auto; cursor: default; }
.when.soon { background: var(--amber-bg); color: var(--amber); }
.when.stale { background: var(--red); color: var(--surface); }

.act.stale { background: var(--red-bg); border-left: 6px solid var(--red); }

.when.today { background: var(--amber-bg); color: var(--amber); }
.when.rdv { background: var(--sage); color: var(--sage-ink); }
.todo .t { min-width: 0; }
.todo .t .ens { font-size: 14px; }
.todo .t small { display: block; color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub-h { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); margin: 14px 0 4px; }
.sub-h:first-child { margin-top: 0; }
.note { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: flex-start; }
.note .ms { font-size: 16px; }

.kpi-link { text-align: left; font: inherit; color: inherit; cursor: pointer; }
.kpi-link:hover { border-color: var(--amber); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 8px 20px 0; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 8px; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--link); border-bottom-color: var(--primary); }
.tabs .n { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--grey-bg); color: var(--grey-ink); font-variant-numeric: tabular-nums; }
.tabs .n.late { background: var(--red-bg); color: var(--red); }
.todo-list { max-height: 520px; overflow-y: auto; margin: 0; padding: 0; }
.trow { list-style: none; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line-soft); align-items: center; }

.grow { flex: 1; }
.act { grid-column: 2; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 0; border-left: 3px solid var(--ink-3); text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.act:hover { filter: brightness(0.97); }
.act > div { flex: 1; }
.act > .ms { margin-top: 2px; }
.act div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.act b { font-size: 15px; }
.act small { color: var(--ink-2); font-size: 12px; }
.act-k { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.act.late { background: var(--red-bg); border-left-color: var(--red); }
.act.late .act-k, .act.late small b, .icons-ok .act.late > .ms { color: var(--red); }
.act.today { background: var(--amber-bg); border-left-color: var(--amber); }
.act.today .act-k, .act.today small b, .icons-ok .act.today > .ms { color: var(--amber); }
.why { font-weight: 600; color: var(--sage-ink); }
.panel { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px; background: var(--surface-2); border-radius: 8px; }
.rq { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.rq input { width: 18px; height: 18px; accent-color: var(--primary); margin: 2px 0 0; flex: none; }
.rq-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 0 0; }

/* ---------- Fiche ---------- */
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font-weight: 500; }
.fiche { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 20px; }
.kv div { min-width: 0; }
.kv dt { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
dl { margin: 0; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line-soft); }
.tl li:first-child { border-top: 0; padding-top: 4px; }
.tl .dot { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--sage); color: var(--sage-ink); }

.tl .head b { font-weight: 600; }
.tl p { margin: 6px 0 0; color: var(--ink); max-width: 70ch; }
.tl .meta { color: var(--ink-2); font-size: 12px; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }

.side-stack { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 84px; }
.contact-line { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line-soft); }
.contact-line:first-of-type { border-top: 0; }
.icons-ok .contact-line .ms { color: var(--ink-2); }
.contact-line span:last-child { overflow-wrap: anywhere; min-width: 0; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.banner { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--red-line); background: var(--red-bg); color: var(--red); font-weight: 500; }

/* ---------- Recherches ---------- */
.rech { display: grid; grid-template-columns: minmax(280px, 0.9fr) minmax(0, 2fr); gap: 16px; align-items: start; }
.rlist { display: flex; flex-direction: column; padding: 6px; }
.ritem { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 12px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; width: 100%; }
.ritem:hover { background: var(--surface-2); }
.ritem[aria-current="true"] { background: var(--sage); border-color: color-mix(in srgb, var(--primary) 35%, transparent); }
.ritem .top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.ritem .top b { font-weight: 600; }
.ritem small { color: var(--ink-2); }
.ritem .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.params { display: flex; gap: 8px 20px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; }
.params b { color: var(--ink); font-weight: 600; }
.tri-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tri-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.tri-tabs button[aria-pressed="true"] { border-color: var(--primary); color: var(--link); background: var(--sage); }

/* ---------- Recherche Google Maps ---------- */
.sbar { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.sbar-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sbar-row.sep { border-top: 1px solid var(--line); padding-top: 14px; }
.sbar .search { min-width: 220px; }
.sbar .search .input { height: 48px; }
.lbl-w { min-width: 120px; }
.src { display: inline-flex; align-items: center; gap: 6px; background: var(--primary); color: var(--on-primary); font-weight: 600; padding: 0 14px; height: 40px; border-radius: 8px; }
.btn.lg { min-height: 48px; padding: 0 20px; font-size: 15px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }

.chipt.on { background: var(--sage); border-color: color-mix(in srgb, var(--primary) 45%, transparent); color: var(--sage-ink); font-weight: 600; }
.chipt .ms { font-size: 16px; }
.rhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rhead h2 { margin: 0; font-size: 18px; }
.rgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.rlist2 { display: flex; flex-direction: column; gap: 12px; max-height: 780px; overflow-y: auto; padding-right: 4px; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.rcard:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); }
.rcard.on { border: 2px solid var(--primary); box-shadow: inset 0 3px 0 var(--primary); padding: 15px 17px; }
.rc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.rc-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
.rc-sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--ink-2); }
.rc-sub > span:not(.badge):not(.num) { color: var(--ink-3); }
.rc-line { display: flex; align-items: center; gap: 8px; color: var(--ink-2); min-width: 0; flex-wrap: wrap; }
.rc-line .ms { font-size: 18px; }
.rc-line .site { overflow-wrap: anywhere; }
.rc-warn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: var(--amber-bg); border: 1px solid var(--amber-line); color: var(--amber); font-size: 13px; font-weight: 500; }
.rc-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid var(--line-soft); margin-top: 2px; }
a.btn { text-decoration: none; }
.rc-main { display: inline-flex; gap: 8px; margin-left: auto; }
.temp { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.temp i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.temp.t-chaud { background: var(--hot-bg); color: var(--hot); }
.temp.t-tiede { background: var(--amber-bg); color: var(--amber); }
.temp.t-froid { background: var(--cold-bg); color: var(--cold); }
.rc-pot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.potb { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: 12px; cursor: pointer; }
.potb:hover { border-color: var(--ink-3); color: var(--ink); }
.potb.on.p-chaud { background: var(--hot-bg); color: var(--hot); border-color: transparent; }
.potb.on.p-tiede { background: var(--amber-bg); color: var(--amber); border-color: transparent; }
.potb.on.p-froid { background: var(--cold-bg); color: var(--cold); border-color: transparent; }
.temp.t-eval { background: var(--grey-bg); color: var(--grey-ink); }
.temp.tag { font-size: 11px; height: 22px; text-transform: uppercase; letter-spacing: 0.04em; }
.map { position: sticky; top: 84px; overflow: hidden; aspect-ratio: 600 / 640; max-width: 100%; padding: 0; }
.map svg { width: 100%; height: 100%; display: block; }
.m-land { fill: var(--map-land); }
.m-park { fill: var(--map-park); }
.m-water { fill: none; stroke: var(--map-water); stroke-width: 26; stroke-linecap: round; }
.m-road { fill: none; stroke: var(--map-road); stroke-width: 9; }
.m-road.thin { stroke-width: 5; }
.m-radius { fill: color-mix(in srgb, var(--map-ring) 6%, transparent); stroke: var(--map-ring); stroke-width: 1.5; stroke-dasharray: 6 6; }
.m-label { fill: var(--ink-2); font-family: var(--font); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; }
.pin { cursor: pointer; }
.pin .dot { fill: var(--pin); stroke: var(--surface); stroke-width: 3; }
.pin .core { fill: var(--surface); }
.pin .halo { fill: color-mix(in srgb, var(--pin) 22%, transparent); stroke: color-mix(in srgb, var(--pin) 35%, transparent); stroke-width: 1; }
.pin:hover .dot, .pin:focus .dot { stroke-width: 4; }
.t-chaud { --pin: var(--hot); } .t-tiede { --pin: var(--amber); } .t-froid { --pin: var(--cold); } .t-eval { --pin: var(--gone); }
.st-exam { --pin: var(--exam); } .st-retenu { --pin: var(--primary); } .st-doublon { --pin: var(--red); } .st-ecarte { --pin: var(--gone); }
.m-toggle { position: absolute; top: 16px; left: 16px; box-shadow: var(--shadow-menu); }
.m-zoom { position: absolute; top: 16px; right: 16px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-menu); overflow: hidden; }
.m-zoom button { width: 40px; height: 40px; border: 0; background: none; cursor: pointer; color: var(--ink); display: grid; place-items: center; }
.m-zoom button + button { border-top: 1px solid var(--line); }
.m-zoom button:hover { background: var(--sage); }
.m-pop { position: absolute; width: 230px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-modal); padding: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; z-index: 2; }
.m-pop.right { transform: translate(24px, -50%); }
.m-pop.left { transform: translate(calc(-100% - 24px), -50%); }
.m-pop small { color: var(--ink-2); }
.m-pop .btn { align-self: stretch; }
.m-pop-k { align-self: stretch; display: flex; justify-content: space-between; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.m-legend { position: absolute; left: 16px; bottom: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-menu); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; max-width: calc(100% - 32px); }
.m-legend b { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.m-legend div { display: flex; gap: 12px; flex-wrap: wrap; }
.m-legend span { display: inline-flex; align-items: center; gap: 6px; }

function vbars(points, opts = {}) {
  const W = 640, H = 220, L = 32, R = 8, T = 12, B = 30;
  const max = Math.max(1, ...points.map(p => p.v));
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10;
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / points.length, gap = Math.min(10, bw * 0.3);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  points.forEach((p, i) => {
    const x = L + i * bw + gap / 2, w = bw - gap, yy = y(p.v), h = (H - B) - yy, r = Math.min(4, w / 2, h);
    const path = h > 0 ? `M${x},${H - B} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + w - r} Q${x + w},${yy} ${x + w},${yy + r} V${H - B} Z` : "";
    g += `<g data-tip="${esc(p.tip)}"><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>${path ? `<path class="b${p.cur ? " cur" : ""}" d="${path}"/>` : ""}</g>`;
    if (p.label) g += `<text x="${x + w / 2}" y="${H - B + 18}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  g += `<line class="bl" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "")}">${g}</svg></div>`;
}
function hbars(rows, opts = {}) {
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="hbars">${rows.map(r => `<div class="hbar${r.sep ? " sep" : ""}"><span class="l" title="${esc(r.l)}">${esc(r.l)}</span><span class="track"><span class="fill${r.soft ? " soft" : ""}" style="display:block;width:${(r.v / max * 100).toFixed(1)}%" data-tip="${esc(r.tip || r.l + " : " + r.v)}"></span></span><span class="v">${r.v}</span></div>`).join("")}</div>`;
}

async function rdvAction(iid, st) {
  const it = S.interactions.find(i => i.id === iid), c = it && commerce(it.commerceId); if (!c) return;
  it.rdvStatut = st;
  if (LIVE.on && !S.demo) {
    try {
      await sqlLive(`update public.interaction set rdv_statut = ${sqlTxt(st)} where id = ${Number(iid)}; update public.tache set statut = 'Annulée', faite_le = now() where commerce_id = ${Number(c.id)} and statut = 'À faire' and libelle in ('Confirmer le RDV par e-mail', 'Finaliser l''audit avant le RDV');`);
      if (it.agenda) await LIVE.mcp.callTool("n8n", "execute_workflow", { workflowId: WF_ANNULATION, executionMode: "manual", triggerNodeName: "RDV annulé ou reporté sur la plateforme", inputs: { webhookData: { method: "POST", body: { interaction_id: iid } } } }, { cache: false }).catch(() => toast("Événement Google Agenda non retiré : n8n doit être autorisé pour cette page", "error"));
      await loadLive(true);
    } catch (e) { toast(`RDV non mis à jour (${(e && e.code) || "erreur"})`, "error"); return render(); }
  } else save();
  if (st === "Reporté") { ui.prefill = { canal: "Appel", res: "Rendez-vous pris", label: "Nouvelle date du RDV" }; toast("RDV reporté : indique la nouvelle date", "event"); return go("fiche", c.id); }
  toast(`RDV du ${fmt(it.rdv)} annulé${it.agenda ? " · retiré de Google Agenda" : ""}`, "event_busy"); render();
}
async function rdvReponse(iid, rep) {
  const it = S.interactions.find(i => i.id === iid), c = it && commerce(it.commerceId); if (!c) return;
  it.reponseInvit = rep;
  if (LIVE.on && !S.demo) {
    const tq = rep === "Refusée" ? ` insert into public.tache (commerce_id, commercial_id, interaction_origine_id, type, libelle, echeance, source, regle) values (${Number(c.id)}, ${Number(ME_ID)}, ${Number(iid)}, 'Appel', 'Recontacter le gérant (invitation refusée)', ${sqlTxt(addOuvres(TODAY, 1))}, 'Règle J+X', 'invitation refusée → J+1 ouvré');` : "";
    try { await sqlLive(`update public.interaction set rdv_reponse_invitation = ${sqlTxt(rep)} where id = ${Number(iid)};${tq}`); await loadLive(true); }
    catch (e) { return toast(`Réponse non enregistrée (${(e && e.code) || "erreur"})`, "error"); }
  } else save();
  toast(rep === "Refusée" ? "Invitation refusée : tâche « Recontacter le gérant » créée" : `Invitation : ${rep.toLowerCase()}`, "event"); render();
}

async function validateInfo(id, st) {

  if (LIVE.on && !S.demo) {
    try { await sqlLive(`update public.info_energetique set statut_validation = ${sqlTxt(st)}, valide_par = ${Number(ME_ID)}, valide_le = now() where id = ${Number(id)};`); toast(`Information ${st === "Validée" ? "validée" : "rejetée"}`, "bolt"); return loadLive(true); }

/* ---------- Écran : recherches ---------- */
function temp(x) {
  const m = { "Élevé": "chaud", "Moyen": "tiede", "Faible": "froid" }[x.potentiel];
  return { k: m || "eval", est: false };
}
const TEMP_LABEL = { chaud: "Potentiel élevé", tiede: "Potentiel moyen", froid: "Potentiel faible", eval: "Potentiel à évaluer" };
const TRI_KEY = { "À examiner": "exam", "Retenu": "retenu", "Écarté": "ecarte", "Doublon": "doublon" };
function hash01(s, salt) { let h = 2166136261 ^ salt; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }
function pinXY(x) { const k = x.placeId || "c" + x.id, ang = hash01(k, 7) * Math.PI * 2, r = Math.sqrt(hash01(k, 13)) * 0.9 * 230; return [300 + Math.cos(ang) * r, 320 + Math.sin(ang) * r]; }
function candCommerce(x) { if (x.commerceId && commerce(x.commerceId)) return commerce(x.commerceId); return S.commerces.find(c => c.enseigne === x.enseigne) || null; }
function syncSearchForm(r) { ui.rq = `${r.ville || ""}${r.rayon ? `, ${r.rayon} km` : ""}`; ui.rTypes = [...(r.types || [])]; ui.rRayon = r.rayon || 5; }

  const rs = [...S.recherches].sort((a, b) => b.date.localeCompare(a.date));

  const r = S.recherches.find(x => x.id === ui.rechId);
  if (r && ui.rq == null) syncSearchForm(r);
  const ordre = { "À examiner": 0, "Retenu": 1, "Doublon": 2, "Écarté": 3 }, tOrd = { chaud: 0, tiede: 1, froid: 2, eval: 3 };
  const all = r ? S.candidats.filter(x => x.rechercheId === r.id).sort((a, b) => ordre[a.tri] - ordre[b.tri] || tOrd[temp(a).k] - tOrd[temp(b).k] || (b.note || 0) - (a.note || 0)) : [];
  const shown = all.filter(x => !ui.triFilter || x.tri === ui.triFilter);
  if (!shown.some(x => x.id === ui.selCand)) ui.selCand = shown[0] ? shown[0].id : null;
  const counts = {}; all.forEach(x => counts[x.tri] = (counts[x.tri] || 0) + 1);
  const z = ui.zoom || 1, P = v => 300 + (v - 300) * z, Q = v => 320 + (v - 320) * z;
  const color = x => ui.mapMode === "statut" ? "st-" + TRI_KEY[x.tri] : (x.tri === "Retenu" ? "st-retenu" : "t-" + temp(x).k);
  const sel = all.find(x => x.id === ui.selCand);

  const card = x => {
    const tp = temp(x), com = candCommerce(x), on = x.id === ui.selCand, inTour = inTournee("c", x.id);
    const q = encodeURIComponent([x.enseigne, x.adresse, x.cp, x.ville].filter(Boolean).join(" "));
    return `<article class="rcard${on ? " on" : ""}" id="cand-${x.id}" data-pin="${x.id}">
      <div class="rc-head"><h3>${esc(x.enseigne)}</h3><span class="temp t-${tp.k}" title="${esc(potDetail(x))}"><i></i>${TEMP_LABEL[tp.k]}</span></div>

      <div class="rc-line">${ms("location_on")}<span>${esc(x.adresse || "Adresse inconnue")}, ${esc(x.cp || "")} ${esc(x.ville)}</span></div>
      <div class="rc-line muted"><span class="num">${esc(x.tel || "—")}</span>${x.site ? ` <span>•</span> <span class="site">${esc(x.site.replace(/^https?:\/\/(www\.)?/, ""))}</span>` : ""}</div>

let REAL_S = null, DEMO_S = null;
function demoS() {

    const n = Math.round((Date.parse(TODAY + "T12:00:00Z") - Date.parse("2026-10-14T12:00:00Z")) / 864e5);
    const sh = v => { if (!v || !n) return v; const t = new Date(Date.parse(v.length <= 10 ? v + "T12:00:00Z" : v) + n * 864e5).toISOString(); return v.length <= 10 ? t.slice(0, 10) : t; };
    const demo = Object.assign({}, DEMO_RAW, { taches: null, infos: DEMO_RAW.infos || [], interactions: DEMO_RAW.interactions.map(i => { const x = i.slice(); x[3] = sh(x[3]); x[7] = sh(x[7]); x[8] = sh(x[8]); return x; }) });
    const r = RAW; RAW = Object.assign({}, r, demo); DEMO_S = seed(); RAW = r; DEMO_S.demo = true;
  }
  return DEMO_S;
}

function syncRdv() {
  const res = $("#i-res").value, on = isRdvRes(res); $("#rdv-1").hidden = !on; $("#rdv-2").hidden = !on;

/* Le résultat ne change jamais le statut tout seul : il propose, le commercial valide */
function proposeStatut(c, res, ar) {
  const cur = c.statut, r = RANG_STATUT[cur] ?? -1, up = s => (RANG_STATUT[s] > r ? s : null);
  if (res === "Pas intéressé") return cur === "Non intéressé" ? null : "Non intéressé";
  if (ar && ar.statut === "Injoignable") return cur === "Injoignable" ? null : "Injoignable";

function findData(x, depth) {

  }

}

async function mergeTournees() {
  const [t, ...autres] = tourneesDuJour(tourDay()); if (!t || !autres.length) return;

  if (LIVE.on && !S.demo) {
    const ids = autres.map(x => Number(x.id)).join(", ");
    return tourSql(`update public.tournee_arret set tournee_id = ${Number(t.id)}, ordre = ordre + ${ordre} where tournee_id in (${ids}); delete from public.tournee where id in (${ids});`, "Tournées regroupées");
  }
  autres.forEach(x => x.arrets.forEach(a => { a.ordre = ++ordre; t.arrets.push(a); }));
  S.tournees = S.tournees.filter(x => !autres.includes(x)); save(); toast("Tournées regroupées", "route"); render();
}

const sqlTxt = v => v == null ? "null" : "'" + String(v).replace(/'/g, "''") + "'";
function rowsOf(x, depth, key = "statut_tri") {
  if (depth > 8 || x == null) return null;
  if (typeof x === "string") {
    const m = /<untrusted-data-[\w-]+>\s*([\s\S]*?)\s*<\/untrusted-data-/.exec(x);
    for (const c of m ? [m[1], x] : [x]) { try { const v = JSON.parse(c); if (v !== x) { const f = rowsOf(v, depth + 1, key); if (f) return f; } } catch (e) {} }
    return null;
  }
  if (Array.isArray(x)) { if (x.length && x[0] && typeof x[0] === "object" && key in x[0]) return x[0]; for (const v of x) { const f = rowsOf(v, depth + 1, key); if (f) return f; } return null; }
  if (typeof x === "object") for (const v of Object.values(x)) { const f = rowsOf(v, depth + 1, key); if (f) return f; }
  return null;
}
