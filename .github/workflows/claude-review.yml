name: Relecture Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Relecture (payante) seulement quand du code change, pas pour la doc seule.
    paths: ["app/**", "db/**", "tests/**", "scripts/**", ".github/workflows/**", "pyproject.toml"]

jobs:
  review:
    name: Relecture du code par Claude
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Vérifier la présence d'une clé Claude
        id: cle
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$API_KEY" ] && [ -z "$OAUTH_TOKEN" ]; then
            echo "::error::Ajoute le secret ANTHROPIC_API_KEY ou CLAUDE_CODE_OAUTH_TOKEN dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        id: relecture
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Relis cette PR en français en appliquant la section « Relecture des PR » de CLAUDE.md.
            Lis aussi tests/CONTRAT.md avant de juger le code de app/.

            - Un commentaire en ligne par problème réel, avec la correction proposée.
            - Termine par un commentaire de synthèse : verdict (✅ prête / ⚠️ réserves /
              ❌ à corriger), problèmes bloquants, remarques mineures, points à trancher.
            - Ne signale pas de problème de style que Ruff détecte déjà.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Journal Supabase
        id: journal
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STEPS: ${{ toJSON(steps) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pip install --quiet "psycopg[binary]>=3.2"
          python scripts/journaliser_controles.py
