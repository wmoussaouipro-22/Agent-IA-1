name: Site web

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Site web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Valeurs factices : le build ne contacte pas Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: cle-factice-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
