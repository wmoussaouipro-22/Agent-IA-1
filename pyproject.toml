[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-prospection-ia"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -ra --strict-markers"
markers = [
    "unit: Tests unitaires isolés",
    "integration: Tests d'intégration API",
    "ai: Tests des garde-fous IA",
    "e2e: Tests de parcours complets",
    "live: Appels réels aux API externes (ignorés sans clé d'API)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "app"

[tool.ruff.lint.isort]
known-first-party = ["conftest", "auth", "geoloc", "prospects", "scoring", "ai_email", "outlook", "stats"]

[tool.setuptools.packages.find]
where = ["app"]
